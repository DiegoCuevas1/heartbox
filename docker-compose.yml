# Production stack for a single small server (e.g. a $5-10/month VPS).
#
#   cp .env.example .env   # fill in DOMAIN, SECRET_KEY, POSTGRES_PASSWORD, Cloudinary, email
#   docker compose up -d --build
#
# Caddy gets HTTPS certificates automatically and routes /api, /accounts,
# /admin and /static to Django; everything else goes to Next.js. Browsers only
# ever see one origin, so cookies stay first-party and no CORS is needed.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend/heartbox
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: production
      DATABASE_URL: postgres://heartbox:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/heartbox
      ALLOWED_HOSTS: ${DOMAIN},backend,localhost
      FRONTEND_URL: https://${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heartbox
      POSTGRES_USER: heartbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbox"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
